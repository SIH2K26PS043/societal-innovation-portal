<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Industry · Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --primary:hsl(213 85% 30%); --secondary:hsl(152 55% 30%); --accent:hsl(24 88% 45%);
      --bg:hsl(210 20% 97%); --card:#fff; --fg:hsl(215 28% 14%);
      --muted:hsl(210 16% 93%); --muted-fg:hsl(215 15% 42%); --border:hsl(214 22% 88%);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--fg);}
  </style>
</head>
<body>
<div style="width:920px;min-height:820px;background:var(--bg);font-family:Inter,system-ui,sans-serif;padding:32px 36px;">

  <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;">Register your organisation</h1>
  <p style="margin:6px 0 0;font-size:14px;color:var(--muted-fg);">Tell us what you can offer — we'll match you to projects where it fits.</p>

  <div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;margin-top:22px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:7px;">Company / organisation</label>
        <input value="SolarWorks Pvt Ltd" style="width:100%;height:44px;border:1px solid var(--border);border-radius:9px;padding:0 13px;font-family:inherit;font-size:15px;color:var(--fg);">
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:7px;">Sector</label>
        <input value="Solar energy" style="width:100%;height:44px;border:1px solid var(--border);border-radius:9px;padding:0 13px;font-family:inherit;font-size:15px;color:var(--fg);">
      </div>
    </div>

    <label style="display:block;font-size:13px;font-weight:600;margin:20px 0 9px;">What can you offer?</label>
    <div style="display:flex;flex-wrap:wrap;gap:10px;">
      <span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#fff;background:var(--primary);border-radius:10px;padding:9px 14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Funding</span>
      <span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#fff;background:var(--primary);border-radius:10px;padding:9px 14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Prototyping</span>
      <span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#fff;background:var(--primary);border-radius:10px;padding:9px 14px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Pilot site</span>
      <span style="font-size:14px;font-weight:600;color:var(--muted-fg);background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 14px;">Mentoring</span>
      <span style="font-size:14px;font-weight:600;color:var(--muted-fg);background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 14px;">Tech transfer</span>
    </div>

    <label style="display:block;font-size:13px;font-weight:600;margin:20px 0 7px;">About your organisation</label>
    <textarea style="width:100%;height:90px;border:1px solid var(--border);border-radius:9px;padding:12px 13px;font-family:inherit;font-size:15px;color:var(--fg);line-height:1.55;resize:none;">Rooftop and micro-grid solar startup working across Jharkhand. We can fund pilots, build prototypes, and host field tests.</textarea>
  </div>

  <div style="display:flex;gap:12px;margin-top:20px;">
    <button style="height:48px;padding:0 24px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;">Create account</button>
    <button style="height:48px;padding:0 24px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--fg);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Cancel</button>
  </div>
</div>
</body>
</html>
