<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Industry · Offer support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --primary:hsl(213 85% 30%); --secondary:hsl(152 55% 30%); --accent:hsl(24 88% 45%);
      --bg:hsl(210 20% 97%); --card:#fff; --fg:hsl(215 28% 14%);
      --muted:hsl(210 16% 93%); --muted-fg:hsl(215 15% 42%); --border:hsl(214 22% 88%);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--fg);}
  </style>
</head>
<body>
<div style="width:920px;min-height:800px;background:var(--bg);font-family:Inter,system-ui,sans-serif;padding:32px 36px;">

  <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;">Offer support</h1>
  <p style="margin:6px 0 0;font-size:14px;color:var(--muted-fg);">to <strong style="color:var(--fg);">Solar micro-grid for a village</strong> · IIT-ISM Dhanbad</p>

  <div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;margin-top:22px;">
    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:9px;">How will you help?</label>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      <div style="border:2px solid var(--primary);border-radius:11px;padding:14px;background:hsl(213 85% 30% / .05);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <div style="font-size:14px;font-weight:700;margin-top:8px;">Funding</div>
      </div>
      <div style="border:1px solid var(--border);border-radius:11px;padding:14px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted-fg)" stroke-width="2"><path d="M3 21v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2"/><circle cx="9" cy="7" r="3"/><path d="M17 11l2 2 4-4"/></svg>
        <div style="font-size:14px;font-weight:600;margin-top:8px;color:var(--muted-fg);">Mentoring</div>
      </div>
      <div style="border:1px solid var(--border);border-radius:11px;padding:14px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted-fg)" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>
        <div style="font-size:14px;font-weight:600;margin-top:8px;color:var(--muted-fg);">Pilot site</div>
      </div>
    </div>

    <label style="display:block;font-size:13px;font-weight:600;margin:22px 0 7px;">Funding committed</label>
    <div style="display:flex;align-items:center;height:48px;border:1px solid var(--border);border-radius:10px;padding:0 14px;max-width:280px;">
      <span style="font-size:18px;font-weight:700;color:var(--muted-fg);">₹</span>
      <input value="4,00,000" style="border:0;outline:none;flex:1;height:100%;padding:0 8px;font-family:inherit;font-size:18px;font-weight:700;color:var(--fg);background:transparent;">
    </div>

    <label style="display:block;font-size:13px;font-weight:600;margin:22px 0 7px;">Message to the team</label>
    <textarea style="width:100%;height:84px;border:1px solid var(--border);border-radius:9px;padding:12px 13px;font-family:inherit;font-size:15px;color:var(--fg);line-height:1.55;resize:none;">Happy to fund the pilot and host the field test at our Ranchi facility. Can also supply panels at cost.</textarea>
  </div>

  <div style="display:flex;gap:12px;margin-top:20px;">
    <button style="height:48px;padding:0 24px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;">Confirm partnership</button>
    <button style="height:48px;padding:0 24px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--fg);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Cancel</button>
  </div>
</div>
</body>
</html>
