<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University · Project board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --primary:hsl(213 85% 30%); --secondary:hsl(152 55% 30%); --accent:hsl(24 88% 45%);
      --bg:hsl(210 20% 97%); --card:#fff; --fg:hsl(215 28% 14%);
      --muted:hsl(210 16% 93%); --muted-fg:hsl(215 15% 42%); --border:hsl(214 22% 88%);
      --warning:hsl(38 90% 40%); --success:hsl(152 55% 35%);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--fg);}
  </style>
</head>
<body>
<div style="width:1180px;min-height:760px;background:var(--bg);font-family:Inter,system-ui,sans-serif;padding:28px 32px;">

  <!-- header -->
  <div style="display:flex;align-items:center;gap:14px;">
    <div>
      <h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;">Water access — ward 4</h1>
      <div style="font-size:13px;color:var(--muted-fg);margin-top:3px;">Project · BIT Mesra · 4 members</div>
    </div>
    <span style="font-size:12px;font-weight:600;border-radius:999px;padding:4px 11px;background:var(--warning);color:#fff;">IN EXECUTION</span>
    <div style="margin-left:auto;display:flex;">
      <div style="width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--bg);">AV</div>
      <div style="width:32px;height:32px;border-radius:50%;background:hsl(213 40% 70%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--bg);margin-left:-8px;">PR</div>
      <div style="width:32px;height:32px;border-radius:50%;background:hsl(152 40% 55%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--bg);margin-left:-8px;">AK</div>
      <div style="width:32px;height:32px;border-radius:50%;background:hsl(28 60% 60%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--bg);margin-left:-8px;">SG</div>
    </div>
  </div>

  <!-- board -->
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px;">

    <!-- To do -->
    <div style="background:hsl(210 20% 95%);border-radius:14px;padding:14px;">
      <div style="display:flex;align-items:center;gap:8px;padding:2px 6px 12px;"><span style="width:9px;height:9px;border-radius:50%;background:var(--muted-fg);"></span><span style="font-size:13px;font-weight:700;">To do</span><span style="margin-left:auto;font-size:12px;color:var(--muted-fg);">1</span></div>
      <div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;">
        <div style="font-size:14px;font-weight:600;">Hand over maintenance plan</div>
        <div style="font-size:12px;color:var(--muted-fg);margin-top:8px;display:flex;align-items:center;gap:6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>Due week 6</div>
      </div>
    </div>

    <!-- In progress -->
    <div style="background:hsl(38 60% 94%);border-radius:14px;padding:14px;">
      <div style="display:flex;align-items:center;gap:8px;padding:2px 6px 12px;"><span style="width:9px;height:9px;border-radius:50%;background:var(--warning);"></span><span style="font-size:13px;font-weight:700;">In progress</span><span style="margin-left:auto;font-size:12px;color:var(--muted-fg);">2</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;">
          <div style="font-size:14px;font-weight:600;">Prototype filtration + storage unit</div>
          <div style="font-size:12px;color:var(--muted-fg);margin-top:8px;display:flex;align-items:center;gap:6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>Weeks 2–4</div>
          <div style="height:6px;border-radius:3px;background:var(--muted);margin-top:10px;overflow:hidden;"><div style="width:60%;height:100%;background:var(--warning);"></div></div>
        </div>
        <div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;">
          <div style="font-size:14px;font-weight:600;">Pilot in ward 4 &amp; measure</div>
          <div style="font-size:12px;color:var(--muted-fg);margin-top:8px;display:flex;align-items:center;gap:6px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>Weeks 5–6</div>
        </div>
      </div>
    </div>

    <!-- Done -->
    <div style="background:hsl(152 40% 94%);border-radius:14px;padding:14px;">
      <div style="display:flex;align-items:center;gap:8px;padding:2px 6px 12px;"><span style="width:9px;height:9px;border-radius:50%;background:var(--success);"></span><span style="font-size:13px;font-weight:700;">Done</span><span style="margin-left:auto;font-size:12px;color:var(--muted-fg);">1</span></div>
      <div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;opacity:.9;">
        <div style="font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Site survey &amp; network mapping</div>
        <div style="font-size:12px;color:var(--muted-fg);margin-top:8px;">Completed · week 1</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
