<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University · Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      --primary:hsl(213 85% 30%); --secondary:hsl(152 55% 30%); --accent:hsl(24 88% 45%);
      --bg:hsl(210 20% 97%); --card:#fff; --fg:hsl(215 28% 14%);
      --muted:hsl(210 16% 93%); --muted-fg:hsl(215 15% 42%); --border:hsl(214 22% 88%);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--fg);}
  </style>
</head>
<body>
<div style="width:920px;min-height:840px;background:var(--bg);font-family:Inter,system-ui,sans-serif;padding:32px 36px;">

  <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;">Solution proposal</h1>
  <p style="margin:6px 0 0;font-size:14px;color:var(--muted-fg);">Describe how your team will solve this. Submitting sends it to Government for review.</p>

  <div style="display:flex;align-items:center;gap:12px;background:var(--muted);border-radius:12px;padding:12px 14px;margin-top:20px;">
    <span style="font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:#2b8ccc;color:#fff;">Water</span>
    <span style="font-size:14px;font-weight:600;">No water supply — Ranchi ward 4</span>
    <span style="margin-left:auto;font-size:12px;color:var(--muted-fg);">Team: Ranchi Water Access Team</span>
  </div>

  <div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;margin-top:18px;">
    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:7px;">Proposal title</label>
    <input value="Low-cost decentralised water supply for ward 4" style="width:100%;height:44px;border:1px solid var(--border);border-radius:9px;padding:0 13px;font-family:inherit;font-size:15px;color:var(--fg);">

    <label style="display:block;font-size:13px;font-weight:600;margin:20px 0 7px;">Description</label>
    <textarea style="width:100%;height:96px;border:1px solid var(--border);border-radius:9px;padding:12px 13px;font-family:inherit;font-size:15px;color:var(--fg);line-height:1.55;resize:none;">The team will assess the burst-pipeline points, deploy a temporary storage-and-distribution unit, and design a resilient supply layout so ward 4 is not cut off by a single failure.</textarea>

    <label style="display:block;font-size:13px;font-weight:600;margin:20px 0 7px;">Approach &amp; milestones</label>
    <textarea style="width:100%;height:130px;border:1px solid var(--border);border-radius:9px;padding:12px 13px;font-family:inherit;font-size:15px;color:var(--fg);line-height:1.55;resize:none;">1. Site survey + mapping of the damaged network (week 1)
2. Prototype a low-cost filtration + storage unit with a partner (weeks 2–4)
3. Pilot in ward 4 and measure supply hours (weeks 5–6)
4. Hand over a maintenance plan to the local body</textarea>

    <div style="display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--muted-fg);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
      Attach supporting documents (optional)
    </div>
  </div>

  <div style="display:flex;gap:12px;margin-top:20px;">
    <button style="height:48px;padding:0 24px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;">Submit for review</button>
    <button style="height:48px;padding:0 24px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--fg);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Save draft</button>
  </div>
</div>
</body>
</html>
